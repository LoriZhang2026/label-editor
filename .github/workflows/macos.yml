name: Build and verify macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture == 'arm64' && 'arm64' || 'x64' }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify architecture and regression tests
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          python -c "import os, platform; assert platform.machine() == os.environ['EXPECTED_ARCH']"
          python -m pytest -q
      - name: Build, sign locally, test and archive the native app
        run: python build_macos.py
      - name: Upload tested archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macOS-${{ matrix.architecture }}
          path: |
            dist/LabelEditor-macOS-*.zip
            dist/SHA256SUMS-macOS-*.txt
          if-no-files-found: error
          compression-level: 0
      - name: Upload runtime verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macOS-${{ matrix.architecture }}-verification
          path: |
            tmp/qa/macos-bundle/*.json
            tmp/qa/macos-bundle/*.png
            tmp/qa/macos-bundle/*.pdf
            tmp/qa/macos-extracted/*.json
            tmp/qa/macos-extracted/*.png
            tmp/qa/macos-extracted/*.pdf
          if-no-files-found: ignore
